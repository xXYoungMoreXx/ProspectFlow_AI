# Test-only compose: isolated ports to avoid conflicts with dev stack
# Used by vitest.integration.config.ts via Testcontainers
version: "3.9"

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentepro_test
      POSTGRES_PASSWORD: test_secret
      POSTGRES_DB: agentepro_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --save ""
