name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # ── Lint & Typecheck ────────────────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: ESLint
        run: npx turbo lint

      - name: TypeScript Check
        run: npx turbo typecheck

  # ── Unit Tests ──────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: Run Vitest
        run: npx turbo test -- --coverage --reporter=json --outputFile=coverage.json

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: apps/api/coverage/
          retention-days: 14

  # ── Build ───────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci
      - run: npx turbo build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            apps/api/dist/
            apps/web/.next/
          retention-days: 7

  # ── Agent Runtime Tests (Python) ────────────────────────────────────
  test-python:
    name: Agent Runtime Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        working-directory: apps/agent-runtime
        run: |
          pip install -e ".[dev]"

      - name: Run Pytest
        working-directory: apps/agent-runtime
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=src \
            --cov-report=term-missing

  # ── E2E Tests (Playwright + real stack) ────────────────────────────
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentepro
          POSTGRES_PASSWORD: agentepro_ci
          POSTGRES_DB: agentepro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://agentepro:agentepro_ci@localhost:5432/agentepro_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_PRIVATE_KEY: ${{ secrets.CI_JWT_PRIVATE_KEY }}
      JWT_PUBLIC_KEY: ${{ secrets.CI_JWT_PUBLIC_KEY }}
      JWT_ISSUER: agentepro.ci
      JWT_AUDIENCE: agentepro-api
      AGENT_RUNTIME_URL: http://localhost:8001
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate -w @agentepro/api

      - name: Start API server (background)
        run: npm run dev -w @agentepro/api &

      - name: Wait for API to be ready
        run: npx wait-on http://localhost:3001/api/v1/health --timeout 60000 --interval 2000

      - name: Build Next.js for Playwright
        run: npm run build -w @agentepro/web

      - name: Prepare Next.js standalone assets
        run: |
          mkdir -p apps/web/.next/standalone/.next
          cp -r apps/web/.next/static apps/web/.next/standalone/.next/static
          cp -r apps/web/public apps/web/.next/standalone/public

      - name: Install Playwright Browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        working-directory: apps/web
        run: npx playwright test
        env:
          CI: true

      - name: Upload E2E HTML Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload E2E Test Results (JUnit)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: apps/web/playwright-report/results.xml
          retention-days: 14
