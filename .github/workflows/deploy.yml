# Deploy pipeline — DISABLED for localhost-only phase
# Re-enable by adding back the `on:` triggers when cloud deployment is ready.
# Current strategy: localhost via `docker compose -f infra/docker-compose.yml up -d`
# See docs/runbooks/01_iniciar_sistema.md

name: Deploy

on:
  # Triggers disabled — localhost only until cloud target is defined
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to confirm manual trigger"
        required: true

jobs:
  guard:
    name: Cloud Deploy Disabled
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-localhost deploy
        run: |
          if [[ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]]; then
            echo "::error::Cloud deployment is disabled. Run locally: docker compose -f infra/docker-compose.yml up -d"
            exit 1
          fi
          echo "Manual override accepted — but no real deploy target configured yet."
          echo "See docs/runbooks/01_iniciar_sistema.md for localhost setup."
