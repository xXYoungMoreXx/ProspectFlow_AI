name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  # ── Gate: Run CI first ──────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ── Determine Environment ───────────────────────────────────────────
  setup:
    name: Determine Environment
    runs-on: ubuntu-latest
    needs: ci-gate
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

  # ── Deploy Process (MVP) ────────────────────────────────────────────
  deploy-mvp:
    name: Deploy to Local/Self-Hosted (${{ needs.setup.outputs.environment }})
    runs-on: ubuntu-latest
    needs: setup
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Instructions
        run: |
          echo "🚀 Deploying to ${{ needs.setup.outputs.environment }} via Docker Compose"
          echo "For the MVP phase, deployment is performed using a localhost-first strategy."
          echo "Please run 'docker-compose -f infra/docker-compose.yml up -d' on the target environment."

  # ── Post-Deploy Verification ────────────────────────────────────────
  verify:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-mvp, setup]
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Notify Success
        if: success()
        run: echo "🎉 Simulated deployment pipeline for ${{ needs.setup.outputs.environment }} completed successfully!"

