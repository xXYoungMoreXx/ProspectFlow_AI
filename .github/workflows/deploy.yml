name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  # ── Gate: Run CI first ──────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ── Determine Environment ───────────────────────────────────────────
  setup:
    name: Determine Environment
    runs-on: ubuntu-latest
    needs: ci-gate
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

  # ── Deploy API ──────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API (${{ needs.setup.outputs.environment }})
    runs-on: ubuntu-latest
    needs: setup
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci
      - run: npx turbo build --filter=@agentepro/api

      - name: Deploy API to Cloud Run
        run: |
          echo "🚀 Deploying API to ${{ needs.setup.outputs.environment }}"
          echo "TODO: gcloud run deploy agentepro-api-${{ needs.setup.outputs.environment }} ..."
        # Placeholder — actual deployment depends on infra setup

  # ── Deploy Web ──────────────────────────────────────────────────────
  deploy-web:
    name: Deploy Web (${{ needs.setup.outputs.environment }})
    runs-on: ubuntu-latest
    needs: setup
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci
      - run: npx turbo build --filter=@agentepro/web

      - name: Deploy Web to Vercel
        run: |
          echo "🚀 Deploying Web to ${{ needs.setup.outputs.environment }}"
          echo "TODO: vercel deploy --prod ..."
        # Placeholder — wire Vercel CLI or GitHub integration

  # ── Post-Deploy Verification ────────────────────────────────────────
  verify:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-web, setup]
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Health Check
        run: |
          ENV="${{ needs.setup.outputs.environment }}"
          echo "Running health check on $ENV environment..."
          # curl -sf https://api-${ENV}.agentepro.app/api/v1/health || exit 1
          echo "✅ Health check passed (placeholder)"

      - name: Notify Success
        if: success()
        run: echo "🎉 Deployment to ${{ needs.setup.outputs.environment }} completed successfully!"
