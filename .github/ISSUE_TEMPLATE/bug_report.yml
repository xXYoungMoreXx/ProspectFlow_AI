name: Bug Report
description: Report a bug to help us improve Hefesto AI
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the issue...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How do we trigger this bug?
      placeholder: |
        1. Run 'npm run dev'
        2. Go to '/leads'
        3. Click on...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version/Environment
      description: Node.js version, OS, etc.
  - type: checkboxes
    id: checks
    attributes:
      label: Self-Check
      options:
        - label: I have searched for existing issues.
          required: true
        - label: I am using the latest version of the main branch.
          required: true
