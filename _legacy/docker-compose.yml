version: "3.9"

services:
  # ── Banco de dados principal ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prospectflow
      POSTGRES_USER: ${POSTGRES_USER:-pf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pf_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # ── Cache + fila de mensagens ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # ── Evolution API (WhatsApp) ──────────────────────────────────────────────
  evolution:
    image: atendai/evolution-api:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-pf_user}:${POSTGRES_PASSWORD}@postgres:5432/prospectflow
      REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379
      WEBHOOK_GLOBAL_URL: http://app:8000/webhooks/whatsapp
      WEBHOOK_GLOBAL_ENABLED: "true"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal, public]

  # ── Aplicação principal ───────────────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pf_user}:${POSTGRES_PASSWORD}@postgres:5432/prospectflow
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      EVOLUTION_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      BREVO_API_KEY: ${BREVO_API_KEY}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./sites_output:/app/sites_output
      - ./logs:/app/logs
    networks: [internal, public]

  # ── Workers (processam filas em background) ───────────────────────────────
  worker-leadhunter:
    build: .
    restart: unless-stopped
    command: python -m modules.lead_hunter.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pf_user}:${POSTGRES_PASSWORD}@postgres:5432/prospectflow
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on: [app]
    networks: [internal]

  worker-convagent:
    build: .
    restart: unless-stopped
    command: python -m modules.conv_agent.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pf_user}:${POSTGRES_PASSWORD}@postgres:5432/prospectflow
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      EVOLUTION_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on: [app]
    networks: [internal]

  worker-sitebuilder:
    build: .
    restart: unless-stopped
    command: python -m modules.site_builder.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pf_user}:${POSTGRES_PASSWORD}@postgres:5432/prospectflow
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VERCEL_TOKEN: ${VERCEL_TOKEN}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    depends_on: [app]
    networks: [internal, public]

  # ── Monitoramento ─────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    networks: [internal, public]

volumes:
  postgres_data:
  redis_data:
  grafana_data:

networks:
  internal:
    driver: bridge
  public:
    driver: bridge
